---
# ======================================================================
# 03-disk-audit.yml —— 只读审计磁盘占用（⚠️ 本文件已被一次事故重写过）
# ======================================================================
#
# 🔴 事故记录（2026-09-21 14:43–14:54）—— 读这个文件的人必须先看这段
# ----------------------------------------------------------------------
# 本 playbook 的初版包含 `docker system df` 与 `docker system df -v`，
# 结果在服务器上**卡死 3 分 33 秒后报 socket EOF**，并伴随：
#   · dockerd 因 OOM 被内核杀掉两次（NRestarts=2）
#   · 8 个容器里 7 个停摆（只有 pm-mysql 被重启策略拉回来）
#   · dmesg 里连续出现 oom-kill，其中一次被杀的就是 dockerd 自己
#     （anon-rss: 1005360kB —— 它当时吃了 1 GB）
#
# 原因：`docker system df` 要**遍历每一条镜像层**去累计磁盘占用，
# 在内存吃紧的机器上会迅速把内存推爆。
# 这台机器 available 常年只有 138 MiB（8 容器全开时），**根本跑不起它**。
#
# ⇒ **本文件不再包含任何 `docker system df`。**
#    磁盘审计一律走**纯文件系统**路径（du / df），零守护进程负载。
#
# ======================================================================
# 🔴 第二个教训：`du` 不加 `-x` 会把 overlay 挂载点重复计算
# ----------------------------------------------------------------------
#   实测对比（同一次运行）：
#       du -sh  /var/lib/docker  →  **64 G**   ← 假的
#       du -shx /var/lib/docker  →  **12 G**   ← 真的
#
# 差在哪：`/var/lib/docker/overlay2/<id>/merged` 是运行中容器的**合并视图**
# （lower 层 + upper 层）。它是个**挂载点**，不是符号链接，所以 `du` 会走进去，
# 把每个容器的完整文件系统**重复算一遍**。
# `-x`（--one-file-system）让 du 停在文件系统边界，正好跳过这些挂载点。
#
# ⇒ **凡是对 /var/lib/docker 做 du，必须带 -x。**
#    这也解释了当时"63 G 占用 vs 20 G 已用"的自相矛盾 —— 那是我的测量错误，
#    不是服务器的问题。
#
# ======================================================================
# 本文件现在的定位
# ======================================================================
# 只回答一个安全问题：**空间花在哪一层**（镜像层 / 卷 / 构建缓存 / 日志）。
# 不试图给出"可回收多少"的精确值 —— 那需要守护进程做重活，
# 而在这台机器上，那样的代价大于收益。
#
# 运行：
#   cd /root/pm-system/infra/ansible
#   /root/.ansible-venv/bin/ansible-playbook -i inventory.ini playbooks/03-disk-audit.yml
# ======================================================================

- name: 审计磁盘占用（只读，纯文件系统路径）
  hosts: pm_servers
  gather_facts: true
  become: false

  vars:
    docker_root: /var/lib/docker

  tasks:

    # ================================================================
    # 零、前置检查 —— 先证明"读到的值是真的"
    # ================================================================
    - name: "零 | 断言被管端 Python 在 ansible-core 的支持区间内"
      ansible.builtin.assert:
        that:
          - ansible_python_version is version('3.8', '>=')
        fail_msg: >-
          被管端 Python 是 {{ ansible_python_version }}，低于 ansible-core 2.19
          要求的 3.8。模块会在被管端静默失败、只留下空 stdout。
          修法：把 inventory.ini 的 ansible_python_interpreter 指向
          /usr/bin/python3.11。
        success_msg: "被管端 Python {{ ansible_python_version }}，在支持区间内。"

    # ================================================================
    # 一、磁盘总水位
    # ================================================================
    - name: "1/4 | 磁盘总水位"
      ansible.builtin.command: df -h /
      register: disk_now
      changed_when: false
      failed_when: false

    - name: "1/4 | 磁盘总水位（输出）"
      ansible.builtin.debug:
        var: disk_now.stdout_lines

    # ================================================================
    # 二、空间花在哪一层
    # ================================================================
    # 🔴 必须带 -x。不加会把 overlay2/*/merged 这些挂载点重复算进去，
    #    实测会把 12 G 虚报成 64 G。详见文件头。
    - name: "2/4 | /var/lib/docker 各子目录体积（-x 不跨文件系统）"
      ansible.builtin.shell: du -shx {{ docker_root }}/*/ 2>/dev/null | sort -hr
      register: docker_subdirs
      changed_when: false
      failed_when: false

    - name: "2/4 | 对照：不加 -x 会虚报多少"
      ansible.builtin.shell: >-
        printf 'du -shx  →  %s\n' "$(du -shx {{ docker_root }} 2>/dev/null | cut -f1)"
        && printf 'du -sh   →  %s  （这是虚报值，供对照）\n' "$(du -sh {{ docker_root }} 2>/dev/null | cut -f1)"
      register: du_contrast
      changed_when: false
      failed_when: false

    - name: "2/4 | 子目录体积（输出）"
      ansible.builtin.debug:
        msg:
          - "overlay2   = 镜像层 + 容器可写层"
          - "volumes    = 具名卷（MySQL 数据在这里，**绝不能删**）"
          - "buildkit   = 构建缓存（Cloudland 是服务器构建模式，会持续攒）"
          - "containers = 容器日志与元数据（实测仅 1.9 MiB）"
          - "{{ docker_subdirs.stdout_lines | default([]) }}"
          - ""
          - "{{ du_contrast.stdout_lines | default([]) }}"

    # ================================================================
    # 三、镜像层目录数 —— 用文件系统计数，完全不碰守护进程
    # ================================================================
    # overlay2 下每个目录就是一层。数量本身能说明"层在不在堆积"，
    # 而且这个计数是纯 ls，零内存开销。
    - name: "3/4 | overlay2 层目录数量"
      ansible.builtin.shell: >-
        printf '层目录数      : %s\n' "$(ls -1 {{ docker_root }}/overlay2 2>/dev/null | grep -c '^[0-9a-f]\{64\}$')"
        && printf '其中容器层    : %s\n' "$(ls -1 {{ docker_root }}/overlay2 2>/dev/null | grep -c -- '-init$')"
      register: layer_count
      changed_when: false
      failed_when: false

    - name: "3/4 | 应用镜像 tag 清单"
      ansible.builtin.shell: >-
        docker images --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}'
        | grep -E '^(pm-|cloudland-|crpi-)' | sort
      register: tag_list
      changed_when: false
      failed_when: false

    - name: "3/4 | 应用镜像 tag 计数"
      ansible.builtin.shell: >-
        docker images --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}'
        | grep -cE '^(pm-|cloudland-|crpi-)'
      register: tag_count
      changed_when: false
      failed_when: false

    - name: "3/4 | 层与 tag（输出）"
      ansible.builtin.debug:
        msg:
          - "{{ layer_count.stdout_lines | default([]) }}"
          - "应用相关 tag 数: {{ tag_count.stdout | default('?') | trim }}（≈ 部署过多少次）"
          - "tag 清单（最多 30 条）："
          - "{{ tag_list.stdout_lines | default([])[:30] }}"
          - "↑ 层数远大于 tag 数说明层被共享复用，属正常"

    # ================================================================
    # 四、具名卷
    # ================================================================
    - name: "4/4 | 具名卷体积"
      ansible.builtin.shell: du -shx {{ docker_root }}/volumes/*/ 2>/dev/null | sort -hr
      register: volume_sizes
      changed_when: false
      failed_when: false

    - name: "4/4 | 卷体积（输出）"
      ansible.builtin.debug:
        msg:
          - "⚠️ 这些是 PM 与 Cloudland 的 MySQL 数据，**绝不能靠 prune 回收**"
          - "目录名是卷 ID，可用 docker volume ls 对照名字（那条命令很轻，安全）"
          - "{{ volume_sizes.stdout_lines | default([]) }}"
