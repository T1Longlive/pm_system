# ======================================================================
# pm-system 服务器清单（Ansible inventory）
# ----------------------------------------------------------------------
# 单机形态：控制节点 = 被管节点（就是这台 ECS 本身）。
#
# ansible_connection=local 的含义：
#   不起 SSH 连接，直接在控制节点本机执行任务。
#   因此本清单**不需要任何 SSH 密钥或密码** —— 这是单机场景下
#   最省事、也最容易验证的形态。
#
# 若日后要从本地/CI 远程管理，把 local 换成默认的 ssh 即可，
# 并补上 ansible_host / ansible_user / ansible_ssh_private_key_file。
# ======================================================================

[pm_servers]
pm-ecs ansible_connection=local

[pm_servers:vars]
# ----------------------------------------------------------------------
# 🔴 被管端解释器：这不是可选优化，是**硬性版本约束**
# ----------------------------------------------------------------------
# Ansible 把模块**发到被管端的 Python 上执行**，所以这个解释器的版本
# 必须落在当前 ansible-core 的支持区间内：
#
#     ansible-core 2.19  →  被管端 Python 3.8 – 3.13
#     ansible-core 2.11  →  被管端 Python 3.5 – 3.9
#
# 本机默认 /usr/bin/python3 是 **3.6.8**（Alibaba Cloud Linux 3 自带）。
# 它在 2.11 下可用，在 2.19 下**已经出局**。
#
# 🔴 症状极具欺骗性：模块没能执行，只返回一个 msg，
#    于是 register 出来的变量**没有 stdout / stdout_lines**，
#    而只读任务通常都关了失败判定（failed_when: false）→
#    任务显示 ok、值却是空的。看起来像"命令没输出"，实际是"模块没运行"。
#
# 所以这里指向 python3.11（由 bootstrap 的前置步骤 dnf 安装）。
# 若该路径不存在，Ansible 会**显式报错**而不是静默降级 —— 这正是我们要的。
#
# 备选做法：删掉本行，让 Ansible 自动探测。它会按
#   /usr/bin/python3.13 → 3.12 → 3.11 → …… 从新到旧试一遍，
# 也能找到 3.11。但显式声明更好审计：读一眼就知道依赖哪个解释器。
ansible_python_interpreter=/usr/bin/python3.11
