# ======================================================================
# pm-system 服务器清单（Ansible inventory）
# ----------------------------------------------------------------------
# 单机形态：控制节点 = 被管节点，就是这台 ECS 本身。
#
# `ansible_connection=local` 的含义：
#   不起 SSH 连接，直接在控制节点本机执行任务。
#   因此本清单**不需要任何 SSH 密钥或密码** —— 在"宿主机自管"场景下
#   这是最省事、也最容易验证的形态。
#
# 日后若要从本地机器或 CI 远程管理，把 local 换成默认的 ssh 即可，
# 并补上：
#   ansible_host=<公网IP>  ansible_user=root
#   ansible_ssh_private_key_file=~/.ssh/id_ed25519
# ======================================================================

[pm_servers]
pm-ecs ansible_connection=local

[pm_servers:vars]
# 显式钉死解释器版本，避免 Ansible 依赖 /usr/bin/python 这个软链存在。
# 若服务器上 python3 不在这个路径，删掉本行让 Ansible 自动探测。
ansible_python_interpreter=/usr/bin/python3
