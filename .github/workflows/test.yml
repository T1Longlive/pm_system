name: tests

# ======================================================================
# 测试流水线（与 build-deploy 解耦）
# ----------------------------------------------------------------------
# 职责：只做质量门禁，不构建镜像、不部署。
#   · backend  ：mvn verify = 单元测试 + Testcontainers 集成测试 + JaCoCo 门禁
#   · frontend ：vue-tsc 类型检查 + vite 构建
#
# 为什么单独一个 workflow：
#   build-deploy 只在 push main 时跑，PR 阶段没有测试反馈；
#   把测试拆出来可以挂到 pull_request 上，且失败不会影响镜像构建链。
#
# Testcontainers 在 GitHub ubuntu runner 上可直接使用（runner 自带 Docker），
# 无需 service containers；MySQL/Redis 容器由测试代码自行拉起。
# ======================================================================

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'settings.xml'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'settings.xml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# 同一分支的旧运行自动取消，避免排队浪费额度
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单测 + 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: mvn verify（含 Testcontainers 与覆盖率门禁）
        run: mvn -B -s settings.xml -f backend/pom.xml verify

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 单元测试 + 覆盖率
        working-directory: frontend
        run: npm run test:unit:ci

      # npm run build = vue-tsc --noEmit && vite build
      - name: 类型检查 + 构建
        working-directory: frontend
        run: npm run build

      - name: 上传前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
