name: build-and-deploy

# ======================================================================
# pm-system 主交付流水线（GitHub Actions）
# ----------------------------------------------------------------------
# 历史：最初使用 Gitee Go，因个人版构建额度耗尽、触发不稳定，2026-09-23 迁到
# GitHub Actions；Gitee 相关配置已于 2026-11-04 全部移除。
#
# 相比原 Gitee 版的三个关键点：
#   1. **原生 paths 过滤**：只改 docs/ 或 infra/ 不会触发构建。
#   2. **显式认证链**：先 docker login ACR 再 build，Dockerfile 的 FROM 指向
#      自己的 ACR（基础镜像来源固定），不依赖构建机的网络运气。
#   3. **workflow_dispatch**：网页上点一下就能重跑，不用靠空提交触发。
#
# ⚠️ 两条铁律（与 deploy.sh 的契约）：
#   · 镜像 tag = ${{ github.sha }}，与服务器仓库 HEAD 必须是同一个 commit
#   · GHA 只负责「构建 + 通知服务器」，不直接碰容器 —— 部署逻辑仍在 deploy.sh 里，
#     这样 Jenkins 备用通道和手动部署走的是同一份脚本，不会出现两套真相
# ======================================================================

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - 'settings.xml'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  ACR_HOST: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com
  ACR_NAMESPACE: t1longlive

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    # 默认上限 360 分钟太宽松：一旦卡死（依赖源挂、镜像 pull 卡住）会空转烧掉大量额度。
    # 两个镜像冷构建实测 10~20 分钟，30 分钟足够且留了余量。
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 体检：Secrets 是否就位
        # Secret 缺失时 docker/login-action 只报一句含糊的
        # "Username and password required"，看不出缺的是哪个。这里先逐个点名。
        # 用 env 传递而非把 ${{ secrets.X }} 内联进 shell —— 密码里的特殊字符
        # （$ ` ! 等）内联时会被 shell 解析，env 传递不会。
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for pair in "ACR_USERNAME:$ACR_USERNAME" "ACR_PASSWORD:$ACR_PASSWORD"; do
            if [ -z "${pair#*:}" ]; then
              echo "MISSING: ${pair%%:*} —— 去 Settings → Secrets and variables → Actions 添加"
              missing=1
            else
              echo "OK: ${pair%%:*}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: 登录阿里云 ACR
        # 必须先登录：Dockerfile 的 FROM 用的是本项目 ACR 里的私有基础镜像
        # （maven / node / nginx / temurin），未登录会 pull denied。
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建后端镜像（先不推送）
        # 用 docker CLI 而非 build-push-action：前者复用 daemon 的 ~/.docker/config.json，
        # 私有基础镜像的拉取认证不会丢（buildx 的 docker-container driver 不共享该认证）。
        run: |
          set -euo pipefail
          docker build \
            -f ./backend/Dockerfile \
            -t pm-backend:${{ github.sha }} \
            .

      - name: Trivy 扫描后端镜像
        # 扫的是刚构建完的本地镜像，扫不过就不往下推 —— 漏洞制品不进仓库。
        #
        # exit-code '1' = 硬门禁（2026-09-24 启用）。
        #   启用前的两步摸底：首轮报 41 条（CRITICAL 8 / HIGH 33），
        #   升 Spring Boot 4.1.1 + 覆盖 Tomcat 11.0.25 后降到 3 条 CRITICAL，
        #   再转存基础镜像后归零。基线清楚了才敢改硬门禁 ——
        #   一开始就直接阻断，只会天天红，红到没人看等于没装。
        #
        # ignore-unfixed: 上游还没出修复版本的漏洞先放过（我们无从修，只能接受风险）。
        # 个别需要长期放过的走仓库根的 .trivyignore（每条必须写理由和复查条件）。
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pm-backend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: 推送后端镜像
        run: |
          set -euo pipefail
          docker tag pm-backend:${{ github.sha }} $ACR_HOST/$ACR_NAMESPACE/pm-backend:${{ github.sha }}
          docker push $ACR_HOST/$ACR_NAMESPACE/pm-backend:${{ github.sha }}

      - name: 构建前端镜像（先不推送）
        run: |
          set -euo pipefail
          docker build \
            -f ./frontend/Dockerfile \
            -t pm-frontend:${{ github.sha }} \
            .

      - name: Trivy 扫描前端镜像
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pm-frontend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: 推送前端镜像
        run: |
          set -euo pipefail
          docker tag pm-frontend:${{ github.sha }} $ACR_HOST/$ACR_NAMESPACE/pm-frontend:${{ github.sha }}
          docker push $ACR_HOST/$ACR_NAMESPACE/pm-frontend:${{ github.sha }}

      - name: 输出本次制品
        run: |
          echo "backend  : $ACR_HOST/$ACR_NAMESPACE/pm-backend:${{ github.sha }}"
          echo "frontend : $ACR_HOST/$ACR_NAMESPACE/pm-frontend:${{ github.sha }}"

  deploy:
    name: 部署到阿里云 ECS
    needs: build
    runs-on: ubuntu-latest
    # 部署只是 SSH + 拉镜像 + 健康检查，正常 2~3 分钟。
    # 给 10 分钟：SSH 连不上时会一直重试到超时，别让整个流水线挂太久。
    timeout-minutes: 10
    steps:
      - name: 体检：部署用 Secrets 是否就位
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for pair in "SERVER_HOST:$SERVER_HOST" "SERVER_USER:$SERVER_USER" "SSH_PRIVATE_KEY:$SSH_PRIVATE_KEY"; do
            if [ -z "${pair#*:}" ]; then
              echo "MISSING: ${pair%%:*} —— 去 Settings → Secrets and variables → Actions 添加"
              missing=1
            else
              echo "OK: ${pair%%:*}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: SSH 执行部署脚本
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            # appleboy/ssh-action 的远程 shell 不会设置登录用户的 HOME（实测为空/非 /root）。
            # 不显式设置的话，git 的 ssh 读不到 /root/.ssh/config 与部署密钥，
            # docker 也读不到 /root/.docker/config.json 里的 ACR 登录凭据。
            export HOME=/root
            cd /root/pm-system
            # 先同步代码再执行脚本 —— 否则 deploy.sh 内部的 git reset --hard
            # 会把「正在执行的自己」覆盖掉，bash 后续读到的行可能与开头不一致。
            # 同步后 deploy.sh 自己的 fetch/reset 就是 no-op，不会再覆盖自身。
            git fetch origin main
            git reset --hard origin/main
            # IMAGE_TAG 由 CI 显式指定 —— 服务器不再用 git rev-parse HEAD 去猜。
            # 这样「跑哪个版本的镜像」与「服务器仓库同步到哪」解耦：
            # 即使代码同步慢一步，也不会拉错 tag（过去这是 pull 失败的主要来源）。
            export IMAGE_TAG=${{ github.sha }}
            # CI_COMMIT_SHA 供 deploy.sh 的竞态守卫使用
            # （构建期间又有新 push 时跳过本次部署，交给更新的那次流水线）
            export CI_COMMIT_SHA=${{ github.sha }}
            /bin/bash scripts/deploy.sh main
