# ======================================================================
# pm-system 部署编排
# ----------------------------------------------------------------------
# 对外只暴露前端 8081（Cloudland 已占用 80）。
# 后端 8080 / MySQL 3306 / Redis 6379 一律不做宿主机端口映射，
# 仅在 compose 内部网络可达 —— 这是生产环境的基本原则。
# ======================================================================

services:
  backend:
    # 镜像由 Gitee 云端构建并推送到阿里云 ACR
    # （见 .workflow/流水线-*.yml 里的 build@docker 步骤）
    # 服务器只 pull + up，不再本地编译 —— 这是方案 B 的核心。
    # ⚠️ 地址中的 t1longlive 是 Gitee 个人空间地址，Gitee Go 会用它作 ACR 命名空间
    image: registry.cn-hangzhou.aliyuncs.com/t1longlive/pm-backend:latest
    container_name: pm-backend
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问 MySQL / Redis
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PM_UPLOAD_DIR: /pm-upload
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Shanghai
    volumes:
      # 附件持久化：容器重建不丢文件
      - pm-upload:/pm-upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # 不映射端口：只允许 compose 网络内的 frontend 访问

  frontend:
    # 同上：镜像来自云端构建产物
    image: registry.cn-hangzhou.aliyuncs.com/t1longlive/pm-frontend:latest
    container_name: pm-frontend
    ports:
      # 对外唯一入口。改这里即可调整对外端口。
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: pm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pm_system
    # 不映射 3306 到宿主机
    volumes:
      - pm-mysql-data:/var/lib/mysql
      # 建表脚本：MySQL 官方镜像会在「数据目录为空时」自动执行
      # /docker-entrypoint-initdb.d/ 下的 .sql。不挂这里，库建出来就是空的，
      # 后端启动时（ApplicationRunner / ApplicationReadyEvent 会查库）会直接崩。
      # 注意：仅在首次初始化时执行一次；卷里已有数据则不会重跑。
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # 后端要等 MySQL 真正可连接再启动，否则会连不上库
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # 不映射 6379 到宿主机
    volumes:
      - pm-redis-data:/data
    restart: unless-stopped

volumes:
  pm-upload:
  pm-mysql-data:
  pm-redis-data:
