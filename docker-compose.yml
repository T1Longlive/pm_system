# ======================================================================
# pm-system 部署编排
# ----------------------------------------------------------------------
# 对外只暴露前端 8081（Cloudland 已占用 80）。
# 后端 8080 / MySQL 3306 / Redis 6379 一律不做宿主机端口映射，
# 仅在 compose 内部网络可达 —— 这是生产环境的基本原则。
#
# ======================================================================
# 🔴 内存：本文件的每一项内存参数都是事故后加的，不要删
# ----------------------------------------------------------------------
# 2026-09-21 这台服务器发生过一次 OOM 雪崩：
#   · 内核 OOM killer 先杀 Cloudland 的 java，再杀 MySQL，
#     最后把 dockerd 自己（RSS 1 GB）也杀了两次
#   · 结果 8 个容器里 7 个停摆，而 Docker 因 hasBeenManuallyStopped=true
#     不会自动拉起它们
#
# 根因是**结构性超配**（数字是实测的）：
#   宿主机           1870 MiB
#   非容器底座       ~250 MiB（阿里云盾 / 宝塔 / CI runner / dockerd / containerd / journald）
#   每套栈原占用     ~725 MiB（Java ~350 + MySQL ~360 + Redis + nginx）
#   两套栈           1450 MiB
#   ⇒ 1450 + 250 = 1700 MiB，对着 1870 MiB 的机器，可用余量只有 138 MiB
#
# 因此下面三处都做了收敛（本文件里两处，另一处见 01 号 playbook 的 swap）：
#   1. backend 的 JAVA_TOOL_OPTIONS —— 限制 JVM 堆
#   2. mysql 的 command            —— 缩小 InnoDB 缓冲池、关掉 performance_schema
#   3. 宿主机加了 2 GiB swap       —— 吸收冷启动尖峰（不在本文件里）
#
# ⚠️ 这些不是"可选优化"。删掉它们，OOM 会再来一次。
#
# ======================================================================
# 🔴 容器内存上限（mem_limit）：爆炸半径控制
# ----------------------------------------------------------------------
# 上面那些参数管的是"少用内存"；mem_limit 管的是**失控时的边界**。
#
# 没有它的时候，任何一个容器都可以吃满 1.87 GiB 宿主机内存 ——
# 2026-09-21 的事故就是这么发生的：mysqld 触发 OOM，内核把 **dockerd 自己**
# 杀了两次，8 个容器里 7 个停摆，而 Docker 因 hasBeenManuallyStopped=true
# 不会自动拉起它们。整机停摆约 30 分钟。
#
# 设上限之后：OOM 被关在那个容器的 cgroup 里，**只杀它自己**，
# dockerd 与其余 7 个容器毫发无伤。事故规模从"整机停摆"降为"一个容器重启一次"。
#
# ⚠️ 各项限额之和（2176 MiB）**大于**物理内存（1870 MiB）—— 这是刻意的：
#    mem_limit 不是"总量配额"，而是"单个容器的失控边界"。
#    真要限制总量，得靠宿主机本身加内存，或减少并发负载。
# ⚠️ 只设 mem_limit 时，Docker 会让 memswap_limit 默认为它的 2 倍，
#    即允许容器用等量 swap —— 我们保留这个默认（宁可慢，也不要被直接杀掉）。
#
# ⚠️ 应用镜像按 IMAGE_TAG 取 tag（值 = commit SHA），不再是 latest。
#    正常部署走 scripts/deploy.sh（它负责计算并导出 IMAGE_TAG）。
#    手工排查时也必须带上，否则本文件会直接报错：
#        cd /root/pm-system
#        IMAGE_TAG=$(git rev-parse HEAD) docker compose ps
# ======================================================================

services:
  backend:
    # 镜像由 GitHub Actions 构建并推送到阿里云 ACR
    # （见 .github/workflows/build-deploy.yml）
    # 服务器只 pull + up，不再本地编译 —— 这是方案 B 的核心。
    # ⚠️ 地址中的 t1longlive 只是 ACR 命名空间，与代码托管平台无关
    #
    # tag 不再写死 latest，而是按 IMAGE_TAG 取（= commit SHA）。
    # IMAGE_TAG 由 scripts/deploy.sh 计算并 export，绝不在 .env 里定义。
    # 用 `:?` 而非 `:-` 是刻意的：变量缺失时直接报错退出，
    # 避免"静默拉取 latest"这种查不出来的错。
    # （报错文案保持纯 ASCII，避免服务器 locale 不完整时输出乱码。）
    image: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com/t1longlive/pm-backend:${IMAGE_TAG:?IMAGE_TAG is not set - deploy via scripts/deploy.sh}
    container_name: pm-backend
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 512m
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问 MySQL / Redis
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PM_UPLOAD_DIR: /pm-upload
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Shanghai
      # ================================================================
      # 🔴 JVM 堆上限 —— 2026-09-21 OOM 事故的直接对策
      # ================================================================
      # 不加这一行时，JVM 默认取宿主内存的 1/4。对一台 1.8 GiB 的机器，
      # 那是 ~450 MiB/进程 —— 两个后端就是 ~900 MiB 的潜在堆，
      # 叠上两个 MySQL（各 ~360 MiB RSS）必然超配。
      # 后果实测：内核 OOM killer 连 dockerd 一起杀了两次，7 个容器停摆。
      #
      # 为什么用 JAVA_TOOL_OPTIONS 而不是 JAVA_OPTS：
      #   本镜像的 Dockerfile 用 exec 形式 ENTRYPOINT ["java","-jar",...]，
      #   它不会经过 shell，所以 JAVA_OPTS 根本没人读。
      #   JAVA_TOOL_OPTIONS 是 JVM 自己识别的环境变量，一定生效。
      #
      # -XX:+UseSerialGC：单线程 GC，不额外起 GC 工作线程（省内存与 CPU）
      # -Xss512k：线程栈从默认 1M 降到 512k（Spring/Tomcat 线程较多）
      #
      # -XX:+ExitOnOutOfMemoryError：OOM 时**让进程直接退出**，而不是抛个异常继续跑。
      #   默认行为是「抛 OutOfMemoryError 但进程不死」→ 应用变成半死不活：
      #   容器状态仍是 Up，部署的健康检查照常放行，可某些功能已经在报 500。
      #   **这比直接挂掉更难排查。**
      #   加上它之后：进程退出 → 容器 Exited → restart 策略拉起 → 健康检查发现
      #   → 重启次数上升（可见）。即 fail-fast 换可观测性。
      #   代价：若堆确实不够，会变成重启循环。但 Docker 的 restart 是**指数退避**的，
      #   不会打满 CPU；而且循环本身是明确信号，比"静默降级"好。
      #
      # 🔴 已实测两个镜像的 JVM 都支持这个参数（不支持的参数会让 JVM 拒绝启动）：
      #   pm-backend(Java 17.0.20) / cloudland-backend(Java 8u342) 均返回 0；
      #   对照给一个假参数会报 `Unrecognized VM option` —— 所以这个验证是决定性的。
      #   ExitOnOutOfMemoryError 自 JDK 8u92 起提供。
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError"
    volumes:
      # 附件持久化：容器重建不丢文件
      - pm-upload:/pm-upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # 不映射端口：只允许 compose 网络内的 frontend 访问

  frontend:
    # 同上：镜像来自云端构建产物；tag 由 IMAGE_TAG 决定（见文件头说明）
    image: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com/t1longlive/pm-frontend:${IMAGE_TAG:?IMAGE_TAG is not set - deploy via scripts/deploy.sh}
    container_name: pm-frontend
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 64m
    ports:
      # 对外唯一入口。改这里即可调整对外端口。
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: pm-mysql
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pm_system
    # ================================================================
    # 🔴 缩小 MySQL 的内存占用
    # ================================================================
    # 实测 mysqld 的 RSS 约 360 MiB，其中很大一块是：
    #   · InnoDB 缓冲池：默认 128 MiB
    #   · performance_schema：MySQL 8 默认开启，额外吃 100~200 MiB
    # 本项目是个内部小系统，两者都用不满 —— 关掉后这两个后端仍是完整的。
    #
    # ⚠️ 两个都是**启动参数**，改了必须重建容器才生效（不是热改）。
    #    它们只影响内存分配，**不触碰任何数据**。
    # ⚠️ 这里刻意不加 --skip-name-resolve：它会让基于主机名的授权失效，
    #    属于"省一点内存但可能连不上库"的陷阱，不值得。
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    # 不映射 3306 到宿主机
    volumes:
      - pm-mysql-data:/var/lib/mysql
      # 建表脚本：MySQL 官方镜像会在「数据目录为空时」自动执行
      # /docker-entrypoint-initdb.d/ 下的 .sql。不挂这里，库建出来就是空的，
      # 后端启动时（ApplicationRunner / ApplicationReadyEvent 会查库）会直接崩。
      # 注意：仅在首次初始化时执行一次；卷里已有数据则不会重跑。
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # 后端要等 MySQL 真正可连接再启动，否则会连不上库
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    # 容器内存上限 —— 爆炸半径控制：超了只杀这个容器，不波及整机/dockerd
    mem_limit: 128m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # 不映射 6379 到宿主机
    volumes:
      - pm-redis-data:/data
    restart: unless-stopped

volumes:
  pm-upload:
  pm-mysql-data:
  pm-redis-data:
