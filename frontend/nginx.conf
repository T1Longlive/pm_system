# ======================================================================
# pm-system 前端 nginx 配置
# ----------------------------------------------------------------------
# 两件事：
#   1. 托管 Vue 构建产物（SPA，需要 try_files 回退到 index.html）
#   2. 把 /api 反向代理到后端容器（容器内 DNS 名 backend:8080）
# ======================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，前端资源体积能砍掉一大半
    gzip             on;
    gzip_min_length  1k;
    gzip_comp_level  6;
    gzip_types       text/plain text/css application/json application/javascript
                     text/xml application/xml application/xml+rss text/javascript
                     image/svg+xml;

    # ---------- 静态资源 ----------
    location / {
        # SPA 关键：找不到的路径一律回退到 index.html，交给前端路由处理
        try_files $uri $uri/ /index.html;
    }

    # 带哈希指纹的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则发版后用户拿到旧页面
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        # backend 是 compose 的服务名，由容器内 DNS 解析
        proxy_pass http://backend:8080/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 附件上传最大 60MB，代理层放大限制避免 413
        client_max_body_size 65m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # ---------- 附件静态映射 ----------
    # 后端把上传文件对外暴露在 /upload/**，这里同样走代理
    location /upload/ {
        proxy_pass http://backend:8080/upload/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
