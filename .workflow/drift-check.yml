version: "1.0"
name: pm-system-drift-check
displayName: 基础设施漂移检测
stages:
- name: 漂移检测
  displayName: 漂移检测
  strategy: naturally
  trigger: auto
  # ⚠️ 这条流水线**不构建镜像、不部署** —— 只有一个 shell 步骤，跑只读的 --check。
  #    所以它永远不会动线上：最坏的结果只是"报红告诉你有漂移"。
  #
  # 它和部署流水线（流水线-202609111651.yml）是两条独立的流水线：
  #   · 那个 push 触发、构建 + 部署
  #   · 这个定时触发、只检测
  #   拆开是刻意的 —— 万一定时触发在这套环境不生效，也只是这条不跑，
  #   绝不会牵连部署链路。
  #
  # 退出码即结论（由 drift-check.sh 决定）：
  #   0 = 无漂移（绿）  1 = 检测到漂移（红）  2 = 检测本身出错（红，更紧急）
  executor:
  - t1longlive
  steps:
  - step: shell@agent
    name: run_drift_check
    displayName: 跑 drift-check.sh
    schedulerType: DISTRIBUTED
    scriptType: SH
    script: |-
      set -Eeuo pipefail

      # 服务器上 /root/pm-system 由部署流水线保持同步（deploy.sh 每次都 fetch + reset）
      cd /root/pm-system

      # 保险：确保跑的是仓库里最新的那份脚本
      git fetch origin main >/dev/null 2>&1 || true
      git checkout main >/dev/null 2>&1 || true
      git reset --hard origin/main >/dev/null 2>&1 || true

      /bin/bash infra/ansible/drift-check.sh
    gitClone: "false"
    hostGroupID:
      ID: ali_cloudland
      hostID:
      - 844d9abd-3fd6-4e32-99ee-3339f2497a55
    notify: []
    strategy:
      retry: "0"
# 🔴 定时触发的语法（Gitee Go 官方《触发事件》文档）：
#     triggers.schedule 下目前只支持填一个 cron 表达式。
#     字段 = 分 时 日 月 周（秒位系统自动补 0），用 Quartz 风格的 ? 占位星期。
#       '0 9 * * ?'   每天 09:00
#       '0 */2 * * ?' 每两小时（官方示例）
#     注意：星期和天不能同时为 *，会冲突。
#
# ⚠️ 不要再用网页可视化编辑器保存本文件：编辑器会删注释、删字段
#    （部署流水线的 dependsOn 已经被它删过 3 次）。
triggers:
  trigger: auto
  schedule:
  - cron: '*/15 * * * ?'
