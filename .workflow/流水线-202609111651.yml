version: '1.0'
name: pm-system-deploy
displayName: pm-system-deploy
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
stages:
  - name: build
    displayName: 云端构建镜像
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      # ==============================================================
      # 方案 B：在 Gitee 云端构建 Docker 镜像并推送到阿里云 ACR，
      # 服务器只做 docker compose pull + up -d，不再本地编译。
      # 插件底层是 buildctl（无守护进程），因此不需要 Docker-in-Docker。
      #
      # 🔴 命名空间由 Gitee 自动填充，取的是「Gitee 个人空间地址」，
      #    无法在 tag 里指定。所以 ACR 的命名空间必须建为 t1longlive。
      #    完整镜像地址 = <repository>/t1longlive/<tag 冒号前的仓库名>:<标签>
      # ==============================================================
      - step: build@docker
        name: build_backend_image
        displayName: 构建后端镜像
        repository: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com
        username: T1LONGLIVE
        password: Ckwlq131718/
        tag: pm-backend:latest
        dockerfile: ./backend/Dockerfile
        isCache: false
      - step: build@docker
        name: build_frontend_image
        displayName: 构建前端镜像
        repository: crpi-jzqyelh9p5zb0dmu.cn-chengdu.personal.cr.aliyuncs.com
        username: T1LONGLIVE
        password: Ckwlq131718/
        tag: pm-frontend:latest
        dockerfile: ./frontend/Dockerfile
        isCache: false
  - name: deploy
    displayName: 部署到阿里云主机
    strategy: naturally
    trigger: auto
    dependsOn:
      - build
    executor:
      - t1longlive
    steps:
      - step: shell@agent
        name: deploy_aliyun
        displayName: 执行部署脚本
        schedulerType: DISTRIBUTED
        scriptType: SH
        script: |-
          set -Eeuo pipefail

          APP_DIR="/root/pm-system"
          BRANCH="main"
          REPO_URL="https://gitee.com/t1longlive/pm-system.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo ">> 首次部署：克隆仓库到 $APP_DIR"
            mkdir -p "$(dirname "$APP_DIR")"
            git clone -b "$BRANCH" "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          /bin/bash scripts/deploy.sh "$BRANCH"
        gitClone: 'false'
        hostGroupID:
          ID: ali_cloudland
          hostID:
            - 844d9abd-3fd6-4e32-99ee-3339f2497a55
        notify: []
        strategy:
          retry: '0'
notify: []
