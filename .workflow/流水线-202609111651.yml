version: "1.0"
name: pm-system-deploy
displayName: pm-system-deploy
stages:
- name: 云端构建镜像
  displayName: 云端构建镜像
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: build@docker
    name: build_backend_image
    displayName: 构建后端镜像
    certificate: "18140213287"
    repository: "{{CERTIFICATION.18140213287.server}}"
    username: "{{CERTIFICATION.18140213287.username}}"
    password: "{{CERTIFICATION.18140213287.password}}"
    tag: pm-backend:latest
    dockerfile: ./backend/Dockerfile
    isCache: false
    processorType:
    - amd64
    strategy:
      retry: "0"
  - step: build@docker
    name: build_frontend_image
    displayName: 构建前端镜像
    certificate: "18140213287"
    repository: "{{CERTIFICATION.18140213287.server}}"
    username: "{{CERTIFICATION.18140213287.username}}"
    password: "{{CERTIFICATION.18140213287.password}}"
    tag: pm-frontend:latest
    dockerfile: ./frontend/Dockerfile
    isCache: false
    processorType:
    - amd64
    strategy:
      retry: "0"
- name: 部署到阿里云主机
  displayName: 部署到阿里云主机
  # 质量门禁：必须等构建阶段成功才执行部署。
  # ⚠️ Gitee 可视化编辑器保存流水线时**会丢掉 dependsOn**（已发生两次），
  #    每次在网页端保存后，都要回来确认这一行还在。
  dependsOn:
  - 云端构建镜像
  strategy: naturally
  trigger: auto
  executor:
  - t1longlive
  steps:
  - step: shell@agent
    name: deploy_aliyun
    displayName: 执行部署脚本
    schedulerType: DISTRIBUTED
    scriptType: SH
    script: |-
      set -Eeuo pipefail

      APP_DIR="/root/pm-system"
      BRANCH="main"
      REPO_URL="https://gitee.com/t1longlive/pm-system.git"

      if [ ! -d "$APP_DIR/.git" ]; then
        echo ">> 首次部署：克隆仓库到 $APP_DIR"
        mkdir -p "$(dirname "$APP_DIR")"
        git clone -b "$BRANCH" "$REPO_URL" "$APP_DIR"
      fi

      cd "$APP_DIR"
      git fetch origin "$BRANCH"
      git checkout "$BRANCH"
      git reset --hard "origin/$BRANCH"

      /bin/bash scripts/deploy.sh "$BRANCH"
    gitClone: "false"
    hostGroupID:
      ID: ali_cloudland
      hostID:
      - 844d9abd-3fd6-4e32-99ee-3339f2497a55
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - main
      include: []
notify: []
