version: "1.0"
name: pm-system-deploy
displayName: pm-system-deploy
stages:
- name: 云端构建（Maven + Node）
  displayName: 云端构建（Maven + Node）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@maven
    name: backend_build
    displayName: 后端 Maven 构建与测试
    jdkVersion: "17"
    mavenVersion: "3.9"
    artifacts:
    - name: backend-jar
      path: backend/target/*.jar
      type: .tar.gz
  - step: build@nodejs
    name: frontend_build
    displayName: 前端 Node 构建
    nodeVersion: "20"
    commands:
    - npm ci || npm install
    - npm run build
    artifacts:
    - name: frontend-dist
      path: frontend/dist/**
      type: .tar.gz
- name: 部署到阿里云主机
  displayName: 部署到阿里云主机
  strategy: naturally
  trigger: auto
  executor:
  - t1longlive
  steps:
  - step: shell@agent
    name: deploy_aliyun
    displayName: 执行部署脚本
    schedulerType: DISTRIBUTED
    scriptType: SH
    script: |-
      set -Eeuo pipefail

      APP_DIR="/root/pm-system"
      BRANCH="main"

      if [ ! -d "$APP_DIR/.git" ]; then
        echo ">> 首次部署：克隆仓库到 $APP_DIR"
        mkdir -p "$(dirname "$APP_DIR")"
        # 仓库地址在 Gitee 主机组的「环境变量」里配置，避免把地址写死在流水线里
        git clone -b "$BRANCH" "$GITEE_REPO_URL" "$APP_DIR"
      fi

      cd "$APP_DIR"
      git fetch origin "$BRANCH"
      git checkout "$BRANCH"
      git reset --hard "origin/$BRANCH"

      # 部署脚本内部：flock 并发保护 + compose build + 健康检查
      /bin/bash scripts/deploy.sh "$BRANCH"
    gitClone: "false"
    hostGroupID:
      ID: ali_cloudland
      hostID:
      - 844d9abd-3fd6-4e32-99ee-3339f2497a55
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - main
      precise: []
      include: []
notify: []
